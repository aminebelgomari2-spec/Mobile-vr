<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile VR & Hand Tracking</title>
  <link rel="stylesheet" href="style.css">

  <!-- Three.js (Moteur 3D) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- StereoEffect (Dédoublement d'écran VR) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
  
  <!-- MediaPipe Hands (Tracking des mains) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Bouton d'activation -->
  <button id="startButton">Démarrer l'expérience VR</button>

  <!-- Flux vidéo masqué pour l'IA (capture légère à 320x240 pour éviter les crashs) -->
  <video id="input_video" width="320" height="240" style="display:none;" autoplay playsinline></video>

  <!-- Conteneur 3D -->
  <div id="vr-container"></div>

  <script src="app.js"></script>
</body>
</html>
