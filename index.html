<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Caméra Brut</title>
</head>
<body style="margin:0; background:black; text-align:center;">

  <button id="btn" style="padding:20px; font-size:18px; margin:20px;">
    Lancer la caméra
  </button>
  
  <video id="vid" autoplay playsinline style="width:100%; max-height:80vh; background:#222;"></video>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('vid').srcObject = stream;
      } catch (err) {
        alert("Erreur brute : " + err.name + " - " + err.message);
      }
    });
  </script>

</body>
</html>
